# Play configurations for REST API
# Filters are wired via Global.filters() (Play 2.3 style), not play.http.filters
# (that key is a Play >=2.4 mechanism and is not read by this version).
play {
    http {
        parser.maxMemoryBuffer = 10M
    }

}

# Evolution configuration (auto-apply is controlled per-run via -DapplyEvolutions.default, see run.sh)
evolutionplugin = enabled

# Database configuration
db {
    default {
        driver = com.p6spy.engine.spy.P6SpyDriver
        dialect = "org.hibernate.dialect.PostgreSQL82Dialect"
        url = "jdbc:p6spy:postgresql://localhost:5432/play"
        user = "postgres"
        password = "postgres"
        jndiName = DefaultDS
    }
}

# JPA configuration
jpa {
    default = defaultPersistenceUnit
}

# Akka configurations
akka {
    loggers = ["akka.event.slf4j.Slf4jLogger"]
    loglevel = "INFO"
    log-dead-letters = 10
    log-dead-letters-during-shutdown = on

    actor {
        debug {
            receive = on
            lifecycle = on
        }
        default-dispatcher {
              fork-join-executor {
                    parallelism-min = 2
                    parallelism-factor = 2.0
                    parallelism-max = 16
              }
        }
    }
}

# Http Server configuration
http.port = 9000

# CORS configuration
cors.allowed.origins = "http://localhost:4200,http://127.0.0.1:4200"

# Application configuration
application {
    secret = "changeme"
    langs = "en"
    loader = "play.api.inject.guice.GuiceApplicationLoader"
    name = "Boilerplate"
    version = "0.0.0"

    jwt {
        secret = "SECRET"
        issuer = "com.pedrozc90.play",
        expiration = 3d
    }
}
