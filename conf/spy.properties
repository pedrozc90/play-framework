#################################################################
# P6Spy Options File                                            #
# Logs the real SQL (with bound params) that QueryDSL/Hibernate #
# actually sends to Postgres, for spotting bad generated SQL.   #
#################################################################

module.log=com.p6spy.engine.logging.P6LogFactory

appender=com.p6spy.engine.spy.appender.FileLogger
logfile=logs/p6spy.log

logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(executionTime)ms | %(sqlSingleLine)

# Only log actual statement execution, skip connection/commit noise
excludecategories=info,debug,result,resultset,batch
